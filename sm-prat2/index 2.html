<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h2>Registrar Usuario</h2>

    <form id="userForm">

        <label>Nome:</label><br>
        <input type="text" id="nome"> <br>

        <label>Idade:</label><br>
        <input type="number" id="idade"><br>

        <label>Morada:</label><br>
        <input type="text" id="address"><br>

        <label>Email:</label><br>
        <input type="email" id="email"><br>

        <button type="submit">Guardar dados no storage</button>
        <button type="button" onclick="listUserDatas()">Mostrar dados guardados no storage</button>
        <button type="button" onclick="limpar()">Limpar dados do Storage</button>

    </form>

    <div>

        <h2>Lista e Dados</h2>

        <table border="1" id="userListTable">

            <thead>
                <th>Name</th>
                <th>Idade</th>
                <th>Email</th>
                <th>Adress</th>
            </thead>

            <tbody id="userTableBody">

            </tbody>

        </table>

    </div>
    
    <script src="script2.1.js"></script>

</body>
</html>
